apiVersion: v1
kind: Service
metadata:
  name: {{ include "typesense.fullname" . }}-headless
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "typesense.selectorLabels" . | nindent 4 }}
  ports:
  - name: peering
    port: 8107
    targetPort: peering
    protocol: TCP
  - name: http
    port: {{ .Values.typesense.port }}
    targetPort: http
    protocol: TCP
