apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "typesense.fullname" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "typesense.fullname" . }}-headless
  podManagementPolicy: Parallel
  replicas: {{ .Values.typesense.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "typesense.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "typesense.selectorLabels" . | nindent 8 }}
        role: search-typesense-eagle
    spec:
      containers:
      - name: typesense
        image: "{{ .Values.typesense.image.repository }}:{{ .Values.typesense.image.tag }}"
        imagePullPolicy: {{ .Values.typesense.image.pullPolicy }}
        args:
          - --data-dir=/data
          - --api-key=$(TYPESENSE_API_KEY)
          - --enable-cors
          - --memory-used-max-percentage={{ .Values.typesense.memoryUsedMaxPercentage }}
          - --disk-used-max-percentage={{ .Values.typesense.diskUsedMaxPercentage }}
          - --peering-port=8107
          - --peering-address=$(POD_IP)
          - --nodes=/etc/typesense/nodes
        ports:
        - name: http
          containerPort: {{ .Values.typesense.port }}
          protocol: TCP
        - name: peering
          containerPort: 8107
          protocol: TCP
        env:
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.typesense.existingSecret }}
              key: TYPESENSE_API_KEY
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: data
          mountPath: {{ .Values.typesense.persistence.mountPath }}
        - name: nodes-config
          mountPath: /etc/typesense
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.typesense.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.typesense.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.typesense.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.typesense.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.typesense.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.typesense.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.typesense.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.typesense.probes.readiness.failureThreshold }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.typesense.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.typesense.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.typesense.probes.startup.timeoutSeconds }}
          failureThreshold: {{ .Values.typesense.probes.startup.failureThreshold }}
        resources:
          {{- toYaml .Values.typesense.resources | nindent 10 }}
      volumes:
      - name: nodes-config
        configMap:
          name: {{ include "typesense.fullname" . }}-nodes
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: {{ .Values.typesense.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.typesense.persistence.size }}
