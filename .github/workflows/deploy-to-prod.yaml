# =============================================================================
# Deploy to Prod
# =============================================================================
# Manual workflow — triggered via workflow_dispatch with a version tag.
# Promotes the image and Helm chart to the production environment.
# =============================================================================

name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (short SHA or "test" for current test build)'
        required: true
        default: 'test'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_PROD: 6cdc9e-prod
  IMAGE_NAME: typesense-sync
  HELM_RELEASE: eagle-typesense

jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Log into OpenShift
        run: oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_URL }}

      - name: Tag image for prod
        run: |
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} ${{ env.IMAGE_NAME }}:prod

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_PROD }} \
            --values ./helm/values-prod.yaml \
            --wait --timeout=5m

      - name: Restart sync deployment
        run: |
          if oc get deployment eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} &>/dev/null; then
            oc rollout restart deployment/eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_PROD }}
            oc rollout status deployment/eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} --timeout=3m
            echo "✓ Sync deployment restarted"
          fi

      - name: Verify deployment
        run: |
          oc rollout status deployment/eagle-typesense -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} --timeout=5m
          echo "✓ Typesense server healthy"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_PROD }} -l app.kubernetes.io/instance=typesense
