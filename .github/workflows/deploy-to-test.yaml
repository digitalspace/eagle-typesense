# =============================================================================
# Deploy to Test
# =============================================================================
# Manual workflow — triggered via workflow_dispatch with a version tag.
# Promotes the image and Helm chart to the test environment.
# =============================================================================

name: Deploy to Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (short SHA or "dev" for latest dev build)'
        required: true
        default: 'dev'

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: typesense-sync
  HELM_RELEASE: eagle-typesense

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE_TEST }}

      - name: Tag image for test
        run: |
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} ${{ env.IMAGE_NAME }}:test

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            --values ./helm/values-test.yaml \
            --wait --timeout=5m

      - name: Restart sync deployment
        run: |
          if oc get deployment eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} &>/dev/null; then
            oc rollout restart deployment/eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_TEST }}
            oc rollout status deployment/eagle-typesense-sync -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} --timeout=3m
            echo "✓ Sync deployment restarted"
          fi

      - name: Verify deployment
        run: |
          oc rollout status deployment/eagle-typesense -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} --timeout=5m
          echo "✓ Typesense server healthy"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} -l app.kubernetes.io/instance=typesense
